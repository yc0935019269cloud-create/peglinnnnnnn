<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>哥布林彈珠</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
#unity-fullscreen-container { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; background: #000; }
#unity-canvas { display: block; width: 100% !important; height: 100% !important; border: 0; outline: none; touch-action: none; }
#loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; color: #eee; font: 16px system-ui, sans-serif; text-align: center; pointer-events: none; }
#loading[hidden] { display: none; }
progress { width: min(240px, 70vw); height: 6px; accent-color: #8fbd68; }
#warning { position: absolute; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); color: white; background: #5e2020; padding: 12px; font: 14px system-ui; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="unity-fullscreen-container">
<canvas id="unity-canvas" tabindex="0" aria-label="哥布林彈珠遊戲"></canvas>
<div id="loading" role="status"><span id="loading-text">正在載入遊戲…</span><progress id="progress" max="1" value="0" aria-label="遊戲載入進度"></progress></div>
<div id="warning" role="alert" hidden></div>
</main>
<script>
const canvas = document.getElementById("unity-canvas");
const loading = document.getElementById("loading");
function showBanner(message, type) {
  if (type !== "error") { console.warn(message); return; }
  const warning = document.getElementById("warning");
  warning.textContent = message;
  warning.hidden = false;
  loading.hidden = true;
}
const config = {
  arguments: [],
  dataUrl: "Build/WebRelease.data.unityweb",
  frameworkUrl: "Build/WebRelease.framework.js.unityweb",
  codeUrl: "Build/WebRelease.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  fullscreenElementID: "unity-fullscreen-container",
  companyName: "LocalPeglinResearch",
  productName: "PeglinBrowserLab",
  productVersion: "2.0.12",
  matchWebGLToCanvasSize: true,
  showBanner: showBanner
};
</script>
<script src="ipad-display.js?v=2"></script>
<script>
// Keep the render surface responsive without forcing a browser fullscreen request.
const script = document.createElement("script");
script.src = "Build/WebRelease.loader.js";
script.onerror = () => showBanner("遊戲載入失敗，請檢查連線後重新整理。", "error");
script.onload = () => {
  createUnityInstance(canvas, config, (value) => {
    document.getElementById("progress").value = value;
    document.getElementById("loading-text").textContent = "正在載入遊戲… " + Math.round(value * 100) + "%";
  }).then(() => {
    loading.hidden = true;
  }).catch(message => showBanner(String(message), "error"));
};
document.body.appendChild(script);
</script>
</body>
</html>
