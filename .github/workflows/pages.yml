name: Deploy WebGL to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "PeglinBrowserLab/Builds/WebRelease/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: PeglinBrowserLab/Builds/WebRelease
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: PeglinBrowserLab/Builds/WebRelease
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
